# Veröffentlicht den Server der Notenbrücke bei Cloudflare (kostenloser Tarif).
# Braucht zwei Geheimnisse im Repository: CLOUDFLARE_API_TOKEN und LEHRER_PASSWORT.
# CLOUDFLARE_ACCOUNT_ID ist freiwillig: Fehlt es, wird das Konto über den Token ermittelt.
name: Server veröffentlichen
on:
  push:
    branches: [main]
    paths: ['server/src/**', 'server/schema.sql', 'server/wrangler.toml', '.github/workflows/server.yml']
  workflow_dispatch:
concurrency: { group: server, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KONTO_GEHEIMNIS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEHRER_PASSWORT: ${{ secrets.LEHRER_PASSWORT }}
      CF: https://api.cloudflare.com/client/v4
    steps:
      - name: Geheimnisse vorhanden?
        id: da
        working-directory: .
        run: |
          missing=""; for v in CLOUDFLARE_API_TOKEN LEHRER_PASSWORT; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::notice::Noch nicht eingerichtet. Es fehlen:$missing (Settings > Secrets and variables > Actions)"; echo "### Noch nicht eingerichtet – es fehlen:$missing" >> $GITHUB_STEP_SUMMARY; echo "ok=nein" >> $GITHUB_OUTPUT; exit 0; fi
          if [ ${#LEHRER_PASSWORT} -lt 8 ]; then echo "::error::Das Lehrer-Passwort ist zu kurz (mindestens 8 Zeichen)."; exit 1; fi
          echo "ok=ja" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.da.outputs.ok == 'ja'
      - uses: actions/setup-node@v4
        if: steps.da.outputs.ok == 'ja'
        with: { node-version: 22 }
      - name: Token gültig? Konto ermitteln
        if: steps.da.outputs.ok == 'ja'
        run: |
          id="$KONTO_GEHEIMNIS"
          if [ -z "$id" ]; then
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/accounts?per_page=50" > /tmp/konten.json || true
            n=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync("/tmp/konten.json","utf8"));process.stdout.write(String(r.success?r.result.length:-1))}catch(e){process.stdout.write("-1")}')
            if [ "$n" = "-1" ]; then echo "::error::Cloudflare lehnt den Token ab. Bitte CLOUDFLARE_API_TOKEN neu anlegen (ganzen Token kopieren, ohne Leerzeichen)."; node -e 'try{const r=JSON.parse(require("fs").readFileSync("/tmp/konten.json","utf8"));console.log((r.errors||[]).map(e=>e.code+" "+e.message).join("; "))}catch(e){}'; exit 1; fi
            if [ "$n" != "1" ]; then echo "::error::Der Token sieht $n Cloudflare-Konten. Bitte zusätzlich das Geheimnis CLOUDFLARE_ACCOUNT_ID anlegen."; exit 1; fi
            id=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/konten.json","utf8")).result[0].id)')
          fi
          echo "::add-mask::$id"; echo "CLOUDFLARE_ACCOUNT_ID=$id" >> $GITHUB_ENV; echo "Konto gefunden."
      - name: Adresse workers.dev vorhanden? Sonst anlegen
        if: steps.da.outputs.ok == 'ja'
        run: |
          get() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s);process.stdout.write(r.success&&r.result&&r.result.subdomain||"")}catch(e){}})'; }
          sub=$(get || true)
          if [ -z "$sub" ]; then
            for name in notenbruecke "notenbruecke-$(head -c 3 /dev/urandom | od -An -tx1 | tr -d ' \n')"; do
              curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /dev/null || true
              sub=$(get || true); [ -n "$sub" ] && break
            done
          fi
          if [ -n "$sub" ]; then echo "Adresse: $sub.workers.dev"; else echo "::warning::Konnte keine workers.dev-Adresse anlegen. Falls das Veröffentlichen gleich scheitert: einmal im Cloudflare-Dashboard 'Workers & Pages' öffnen."; fi
      - run: npm i --no-save wrangler@4
        if: steps.da.outputs.ok == 'ja'
      - name: Datenbank suchen oder anlegen (Speicherort EU)
        if: steps.da.outputs.ok == 'ja'
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="notenbruecke");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create notenbruecke --jurisdiction eu || npx wrangler d1 create notenbruecke --location weur
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==="notenbruecke").uuid)})')
          fi
          echo "Datenbank: $id"; sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Tabellen anlegen (bestehende Daten bleiben erhalten)
        if: steps.da.outputs.ok == 'ja'
        run: npx wrangler d1 execute notenbruecke --remote --file schema.sql -y
      - name: Worker veröffentlichen
        if: steps.da.outputs.ok == 'ja'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1); echo "URL=$url" >> $GITHUB_ENV
          echo "### Server-Adresse: $url" >> $GITHUB_STEP_SUMMARY
      - name: Lehrer-Passwort hinterlegen
        if: steps.da.outputs.ok == 'ja'
        run: printf '%s' "$LEHRER_PASSWORT" | npx wrangler secret put LEHRER_PASSWORT
      - name: Funktioniert der Server?
        if: steps.da.outputs.ok == 'ja'
        run: |
          for i in 1 2 3 4 5 6; do sleep 10; curl -fsS "$URL/api/health" && break; done; echo; curl -fsS "$URL/api/health" > /dev/null; echo "SERVER-ADRESSE $URL"
      - name: Server-Adresse im Repository ablegen
        if: steps.da.outputs.ok == 'ja'
        run: |
          git checkout -q wrangler.toml; printf '%s\n' "$URL" > adresse.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adresse.txt; git diff --cached --quiet || { git commit -q -m "Server-Adresse eingetragen"; git pull -q --rebase origin main; git push -q origin HEAD:main; } || echo "::warning::Adresse konnte nicht abgelegt werden: $URL"
