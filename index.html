        this.combo = 0;

        app.audio.sfx("miss");

      this.parts.draw(ctx);

    }

      this.msg = null;
      app.panel.setAcc(0);
      this.n = tk.word ? tk.word.length : 1;
      this.xs = Array.from({ length: this.n }, (_, i) => 176 + (i - (this.n - 1) / 2) * 40);
      app.hud.progress(this.ti, this.tasks.length);
      app.bubble(tk.word ? `Schreibe das Wort <b>${tk.word}</b> \u2013 Note f\xFCr Note.` : `Setze die Note <b>${nameHtml(tk.notes[0])}</b> ins System.`, 0);

      }

    }
  };

        extra: (h) => {
          $("hudExtra").innerHTML = h;
          $("hudExtra").hidden = !h;
        },
        progress: (i, n) => {
          const e = $("hudProg");
          e.hidden = !n;
          if (n) {
            e.innerHTML = n <= 16 ? Array.from({ length: n }, (_, k) => `<i class="${k < i ? "on" : ""}"></i>`).join("") : `${i} / ${n}`;
            e.setAttribute("aria-label", `${i} von ${n}`);
          }
        }
      };
      $("pauseBtn").addEventListener("click", () => {
        if (this.scene && this.scene.isLevel) pause(this);
      });
      const pt = (e) => {
        if (!this.scene || !this.scene.pointer || this.paused) return;
        const r = this.world.getBoundingClientRect();
        this.scene.pointer((e.clientX - r.left) / r.width * 320, (e.clientY - r.top) / r.height * 200);
      };
      $("stage").addEventListener("pointerdown", (e) => {
        if (e.target.closest("#panel,#screen,#hud")) return;
        pt(e);
      });
      $("stage").addEventListener("pointermove", (e) => {
        if (e.buttons && !e.target.closest("#panel,#screen,#hud")) pt(e);
      });
      document.addEventListener("keydown", (e) => {
        const sc = this.scene;
        if (!sc || !sc.isLevel || this.paused || !$("screen").hidden) return;
        if (e.key === "Escape") pause(this);
        else if (sc.move && e.key === "ArrowUp") {
          sc.move(1);
          e.preventDefault();
        } else if (sc.move && e.key === "ArrowDown") {
          sc.move(-1);
          e.preventDefault();
        } else if (sc.place && e.key === "Enter") sc.place();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          this.audio.ensure();
          if (this.scene && this.scene.isLevel) this.audio.keepAwake(true);
        }
        if (document.hidden && this.scene && this.scene.isLevel && !this.paused && $("screen").hidden) pause(this);
      });
      const fit = () => {
        const s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
        $("stage").style.transform = `translate(-50%,-50%) scale(${s})`;
        $("rotate").hidden = window.innerWidth >= window.innerHeight;
      };
      window.addEventListener("orientationchange", () => setTimeout(fit, 250));
      window.addEventListener("resize", fit);
      fit();
      this.applyProfile();
      this.hud.hide();
      title(this);
      this.last = performance.now();
      requestAnimationFrame((t) => this.loop(t));
    }
    get profile() {
      return this.state.profiles.find((p) => p.id === this.state.current) || null;
    }
    get keysOn() {
      const p = this.profile;
      return this.keysSession || !!(p && p.keys);
    }
    get listening() {
      return this.audio.micState === "on" && !this.keysOn;
    }
    applyProfile() {
      const p = this.profile;
      this.heroFrames = makeHero(p ? p.hero : 0);
      if (p) {
        this.audio.setA4(p.a4);
        this.audio.muted = !!p.muted;
      }
    }
    save() {
      return persist(this.store, this.state);
    }
    flush() {
      const p = this.profile;
      if (p && this.sec >= 1) {
        addPractice(p, this.sec);
        this.sec = 0;
      }
      this.save();
    }
    background(theme) {
      return this.bgCache[theme] || (this.bgCache[theme] = makeBackground(theme));
    }
    backdrop(theme) {
      if (this.scene && this.scene.isLevel) this.flush();
      if (!(this.scene instanceof Backdrop) || this.scene.theme !== theme) this.scene = new Backdrop(this, theme);
      this.hud.hide();
      this.bubble(null);
      this.calib = null;
      this.$("toast").hidden = true;
      this.audio.keepAwake(false);
    }
    levelNoteKeys(level) {
      return level.notes;
    }
    keyTap(midi) {
      const sc = this.scene;
      if (sc && sc.onNote && this.keysOn && !this.paused && this.$("screen").hidden) {
        this.audio.ensure();
        sc.onNote(midi);
      }
    }
    hudCr() {
      const p = this.profile;
      this.$("hudCr").innerHTML = `Notenwesen <b>${p ? p.creatures.length : 0}</b>`;
    }
    screen(html, handlers = {}, cls = "") {
      const sc = this.$("screen");
      sc.hidden = false;
      sc.className = cls;
      sc.innerHTML = `<div class="sheet">${html}</div>`;
      fill(sc);
      sc.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (b && !b.disabled && handlers[b.dataset.act]) handlers[b.dataset.act](b);
      };
      const f = sc.querySelector(".go,[data-act]");
      if (f && document.activeElement && document.activeElement.tagName !== "INPUT") f.focus({ preventScroll: true });
    }
    closeScreen() {
      const sc = this.$("screen");
      sc.hidden = true;
      sc.innerHTML = "";
    }
    bubble(html, secs = 0) {
      const b = this.$("bubble");
      clearTimeout(this._bt);
      if (!html) {
        b.hidden = true;
        return;
      }
      b.innerHTML = html;
      b.hidden = false;
      if (secs) this._bt = setTimeout(() => {
        b.hidden = true;
      }, secs * 1e3);
    }
    toast(html, note2) {
      const t = this.$("toast");
      t.innerHTML = `<span>${html}</span>`;
      if (note2) {
        const c = makeCreature((note2.step % 7 + 7) % 7, note2.alt);
        c.className = "pix";
        t.prepend(c);
      }
      t.hidden = false;
      clearTimeout(this._tt);
      this._tt = setTimeout(() => {
        t.hidden = true;
      }, 2400);
      this.hudCr();
    }
    runLevel(level) {
      this.closeScreen();
      this.paused = false;
      this.calib = null;
      this.bubble(null);
      this.hud.extra("");
      this.audio.keepAwake(true);
      const Cls = { jump: JumpScene, boss: JumpScene, regen: RegenScene, bau: BauScene }[level.type];
      this.scene = new Cls(this, level);
      this.scene.enter();
    }
    finishLevel(level, res) {
      const p = this.profile, stars2 = res.stars != null ? res.stars : starsFor(res.ratio), prev = p.levels[level.id], rec = prev || { stars: 0 };
      const out = { ...res, stars: stars2, firstClear: !prev };
      rec.stars = Math.max(rec.stars, stars2);
      if (res.time != null) {
        const nb = !rec.time || res.time < rec.time;
        if (nb) rec.time = Math.round(res.time * 10) / 10;
        if (p.mode === "profi") {
          out.newBest = nb;
          out.bestTime = rec.time;
        }
      }
      if (res.score != null) {
        out.newBest = !rec.score || res.score > rec.score;
        rec.score = Math.max(rec.score || 0, res.score);
        out.bestScore = rec.score;
        p.regenBest = Math.max(p.regenBest || 0, res.score);
      }
      p.levels[level.id] = rec;
      this.scene.isLevel = false;
      this.flush();
      this.bubble(null);
      this.$("hud").hidden = true;
      result(this, level, out);
    }
    loop(ts) {
      const dt = Math.min(0.05, (ts - this.last) / 1e3);
      this.last = ts;
      const sc = this.scene;
      if (!this.paused) {
        const ev = this.audio.poll(ts), sink = this.calib || (this.$("screen").hidden ? sc : null);
        if (ev && sink && sink.onNote && (this.calib || this.listening)) sink.onNote(ev.midi, ev);
        if (this.calib) this.calib.level(this.audio.level);
        else if (sc && sc.isLevel && sc.onNote) {
          const h = this.listening ? this.audio.heard : null;
          this.panel.setLevel(this.listening ? this.audio.level : 0);
          this.panel.setHeard(h ? h.midi : null);
        }
        if (sc) {
          sc.update(dt);
          if (sc.isLevel) {
            this.sec += dt;
            if (this.sec > 20) this.flush();
          }
        }
      }
      if (sc) {
        this.ctx.fillStyle = THEMES[sc.theme || "himmel"].hill[4];
        this.ctx.fillRect(0, 0, 320, 200);
        this.tx.clearRect(0, 0, 1280, 800);
        sc.draw(this.ctx, this.tx);
      }
      requestAnimationFrame((t) => this.loop(t));
    }
  };
  var start = () => {
    window.__nb = new App();
    window.__levels = LEVELS;
    window.__screens = screens_exports;
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start);
  else start();
})();
</script>
</body>
