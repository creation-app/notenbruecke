:root{--k:#26364B;--cream:#FFF1D6;--b1:#2998E8;--b2:#174B83;--sky:#75CCF5;--g1:#78B833;--g2:#467C35;--or:#FF9D35;--ye:#FFD966;--red:#EF5350}
*{box-sizing:border-box}
/* Das Spiel hat feste Farben: Dunkelmodus und automatisches Abdunkeln des Browsers dürfen nichts umfärben. */
:root{color-scheme:only light;forced-color-adjust:none}
input,textarea,select,button{color-scheme:only light;color:var(--k)}input,textarea,select{background-color:#fff}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#101826;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--k);font-size:22px;line-height:1.3}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;overflow:hidden;background:var(--k)}
canvas.pix,#world{image-rendering:pixelated;image-rendering:crisp-edges}
#world{position:absolute;left:0;top:0;width:1280px;height:800px}
#text{position:absolute;left:0;top:0;width:1280px;height:800px;pointer-events:none}
[hidden]{display:none!important}
#rotate{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:var(--k);color:var(--cream);border:3px solid var(--ye);text-align:center;padding:10px 12px;font-size:17px;font-weight:700;pointer-events:none}#rotate p{margin:0}#rotate[hidden]{display:none}
h2{font-family:"Press Start 2P",monospace;font-size:24px;line-height:1.5;margin:0 0 14px}
h3{font-size:24px;margin:10px 0 6px}
p{margin:6px 0}
sup{font-size:.62em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--or);outline-offset:2px}
.btn{min-height:56px;padding:8px 22px;background:var(--cream);border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);font-weight:700;font-size:24px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.btn.go{background:var(--ye)}
.btn.big{font-size:32px;min-height:76px;padding:10px 44px;background:var(--ye)}
.btn.sm{min-height:48px;font-size:20px;padding:6px 14px}
.btn.danger{background:var(--red);color:#fff}
.btn.sel{background:var(--ye)}
.btn.quiet{min-height:44px;font-size:17px;font-weight:400;padding:4px 12px;background:#E8DCC4;border-width:2px;box-shadow:none;color:#3F4C63}
.btn.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1}
.btn.opt small,.toggle small{font-weight:400;font-size:18px}
.row{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.row.tight{gap:10px;margin-top:0}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch}
/* HUD */
#hud{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud .hl,#hud .hr{display:flex;gap:12px;align-items:center}
.box{background:var(--k);color:var(--cream);padding:13px 14px 11px;box-shadow:4px 4px 0 var(--b2);font-family:"Press Start 2P",monospace;font-size:13px;line-height:1.3}
#hudExtra,#hudCr{font-family:"Atkinson Hyperlegible",sans-serif;font-size:22px;padding:8px 14px}
.box b{color:var(--ye)}
#hudProg{display:flex;gap:5px;padding:14px 12px}
#hudProg i{width:12px;height:12px;background:#5A6C84}
#hudProg i.on{background:var(--ye)}
.pause{pointer-events:auto;width:56px;height:56px;border:none;background:var(--red);box-shadow:4px 4px 0 var(--k);display:flex;align-items:center;justify-content:center;gap:8px}
.pause i{width:8px;height:22px;background:var(--k)}
.snd{background:var(--cream)}.snd.off{background:#B9A98A}.snd.float{position:absolute;right:12px;top:12px;z-index:7}#screen.wide{padding-right:84px}#stage.phone #screen.wide{padding-right:58px}

    keyboard(clef) {

      this.right.appendChild(kb);

    key(midi, cls, label2) {

    setHeard(midi) {

      this.mark(midi, "heard", true);
    }
    setHint(midi) {
      if (midi === this.hint) return;

      this.hint = midi;
      this.mark(midi, "hint", true);

    flash(midi, cls) {

      if (!k) return;
      k.classList.add(cls);
      setTimeout(() => k.classList.remove(cls), 600);
    }
    mark(midi, cls, on) {
      const k = midi == null ? null : this.keys.get(midi);
      if (k) k.classList.toggle(cls, on);
    }
    answers(labels, onPick) {
      this.clear();
      const box = document.createElement("div");
      box.className = "answers";
      this.ansBtns = {};
      for (const l of labels) {
        const b = document.createElement("button");
        b.className = "btn ans";
        b.textContent = l;
        b.addEventListener("click", () => onPick(l, b));

        this.ansBtns[l] = b;

    }
    /** Viele Antwortknöpfe (Training mit Vorzeichen: 15 Namen) als Raster einpassen – so groß wie möglich, aber nie über den Rand. */
    fitAnswers() {
      const box = this.ansBox;
      if (!box || !box.isConnected) return;
      const n = box.children.length;
      if (n <= 8) return;
      const cs = getComputedStyle(this.root), gap = 10, W = this.root.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = this.root.clientHeight - parseFloat(cs.paddingTop) - Math.max(14, parseFloat(cs.paddingBottom));
      let best = null;
      if (!(W > 60 && H > 30)) {
        if ((box._try = (box._try || 0) + 1) < 120) requestAnimationFrame(() => this.fitAnswers());
        return;
      }
      for (let rows = 1; rows <= 5; rows++) {
        const cols = Math.ceil(n / rows), w = Math.min(170, (W - gap * (cols - 1)) / cols), h = Math.min(130, (H - gap * (rows - 1)) / rows), score = Math.min(w, h * 1.1);
        if (w > 16 && h > 16 && (!best || score > best.score)) best = { cols, w, h, score };
      }
      if (!best) return;
      box.classList.add("grid");
      box.style.gridTemplateColumns = `repeat(${best.cols}, ${Math.floor(best.w)}px)`;
      box.style.gap = gap + "px";
      box.style.setProperty("--ah", Math.floor(best.h) + "px");
      box.style.setProperty("--af", Math.floor(Math.min(best.h * 0.5, best.w * 0.4)) + "px");
    }
    bau(withAcc, on) {
      this.clear();
      const box = document.createElement("div");
      box.className = "bauctl";
      const mk = (txt, aria, fn, cls = "") => {
        const b = document.createElement("button");
        b.className = "btn " + cls;
        b.innerHTML = txt;
        b.setAttribute("aria-label", aria);
        b.addEventListener("click", fn);
        box.appendChild(b);
        return b;
      };
      mk("&#9650;", "Note h\xF6her", () => on.move(1), "sq");
      mk("&#9660;", "Note tiefer", () => on.move(-1), "sq");
      if (withAcc) {
        this.accBtns = { 1: mk("&#9839;", "Kreuz", () => on.acc(1), "sq"), "-1": mk("&#9837;", "b-Vorzeichen", () => on.acc(-1), "sq") };
      }
      mk("Setzen", "Note setzen", () => on.place(), "go");
      this.right.appendChild(box);
    }
    setAcc(alt) {
      if (this.accBtns) for (const k of [1, -1]) this.accBtns[k].classList.toggle("sel", alt === k);
    }
  };

  init_music();

  var GATE = 52;
  var SPACING = 74;
  var DURATION = 60;
  var RegenScene = class {
    constructor(app, level) {
      this.app = app;
      this.level = level;
      this.isLevel = true;
    }
    enter() {
      const { app, level } = this;
      this.clef = level.clef;
      this.theme = level.theme;
      this.bg = app.background(level.theme);
      this.line = THEMES[level.theme].line;
      this.notes = [];
      this.t = 0;
      this.left = DURATION;
      this.correct = 0;
      this.wrong = 0;
      this.combo = 0;
      this.score = 0;
      this.freeze = 0;
      this.last = null;
      this.parts = new Particles();
      this.started = false;
      const base = app.profile.mode === "profi" ? 30 : 20;
      this.maxSpeed = app.profile.mode === "profi" ? 85 : 60;
      this.missed = 0;
      this.speed = Math.max(base, Math.min(base + 18, 0.75 * (app.profile.regenPace || 0)));
      const order = ["c", "cis", "des", "d", "dis", "es", "e", "f", "fis", "g", "gis", "as", "a", "b", "h"];
      const names = [...new Set(level.notes.map((k) => letterName(N(k))))].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      app.panel.showMic(false);
      app.panel.answers(names, (l, btn) => this.answer(l, btn));
      app.panel.task("Tippe <b>unten den Namen</b> der Note an, bevor sie das rote Tor erreicht.");
      app.hud.show(level.title, true);
      app.hud.progress(0, 0);
      app.bubble("Tippe den Namen der leuchtenden Note, bevor sie das Tor erreicht!", 5);
      for (let i = 0; i < 5; i++) this.spawn(VIEW_W + 20 + i * SPACING);
      this.hudUpdate();
    }
    spawn(x) {
      const k = pickNext(this.level.notes, this.app.profile.notes, Math.random, this.last);
      this.last = k;
      const n = N(k);
      this.notes.push({ n, x, pos: staffPos(n, this.clef), tried: false });
    }
    get active() {
      return this.notes[0];
    }
    hudUpdate() {
      this.app.hud.extra(`<b>${this.score}</b> Punkte${this.combo > 1 ? ` &middot; ${this.combo}\xD7 Serie` : ""} &middot; <span id="rTime">${Math.ceil(this.left)}</span> s`);
    }
    answer(l, btn) {
      const a = this.active, { app } = this, p = app.profile;
      if (!a || this.freeze > 0 || this.left <= 0) return;
      this.started = true;
      if (letterName(a.n) === l) {
        p.notes[a.n.key] = update(p.notes[a.n.key] || newStat(), !a.tried);
        this.correct++;
        this.combo = a.tried ? 0 : this.combo + 1;
        this.score += 10 + Math.min(10, this.combo);
        const room = Math.max(0, Math.min(1, (a.x - GATE) / (VIEW_W - GATE))), inc = a.tried ? 0.8 : this.combo >= 5 && room >= 0.7 ? 7 : this.combo >= 3 && room >= 0.5 ? 4 : 1.6;
        this.speed = Math.min(this.maxSpeed + (this.combo >= 8 ? 20 : 0), this.speed + inc);
        this.parts.burst(a.x, yOfPos(a.pos), [C.YE, C.W, C.OR], 14);
        app.audio.sfx("ok");
        this.notes.shift();
        this.spawn(this.notes[this.notes.length - 1].x + SPACING);
      } else {
        if (!a.tried) {
          a.tried = true;
          this.wrong++;
          const ck = `${a.n.key}>${l}`;
          p.conf[ck] = (p.conf[ck] || 0) + 1;
        }
        this.combo = 0;
        app.audio.sfx("oops");
        btn.classList.add("shake");
        setTimeout(() => btn.classList.remove("shake"), 350);
      }
      this.hudUpdate();
    }
    /** Schmaler Bildschirm (hochkant): Der Weg bis zum Tor ist kürzer – die Noten fliegen entsprechend langsamer, damit gleich viel Zeit zum Lesen bleibt. */
    narrow() {
      return Math.max(0.45, Math.min(1, (VIEW_W - GATE) / 268));
    }
    update(dt) {
      this.t += dt;
      this.parts.update(dt);
      const { app } = this;
      if (this.done) return;
      if (this.started) {
        this.left -= dt;
        const el = document.getElementById("rTime");
        if (el) el.textContent = Math.max(0, Math.ceil(this.left));
      }
      if (this.left <= 0) {
        this.done = true;
        app.audio.sfx("done");
        const total = this.correct + this.wrong + this.missed || 1;
        const th = app.profile.mode === "profi" ? [12, 20, 28] : [8, 14, 20];
        const stars2 = this.correct >= th[2] ? 3 : this.correct >= th[1] ? 2 : 1;
        app.profile.regenPace = this.missed <= 1 && this.correct >= 8 && this.wrong <= this.correct * 0.1 ? Math.round(this.speed) : 0;
        app.finishLevel(this.level, { stars: stars2, score: this.score, freed: [], line: `<b>${this.correct}</b> Noten richtig erkannt &middot; <b>${this.score}</b> Punkte` });
        return;
      }
      if (this.freeze > 0) {
        this.freeze -= dt;
        if (this.freeze <= 0) {
          this.notes.shift();
          this.spawn(this.notes[this.notes.length - 1].x + SPACING);
        }
        return;
      }
      const a = this.active, ahead = a && a.x > VIEW_W + 4;
      for (const n of this.notes) n.x -= (ahead ? Math.max(260, this.speed * 4) : this.speed * this.narrow()) * dt;
      if (a && a.x <= GATE) {
        a.x = GATE;
        a.missed = true;
        this.freeze = 1.3;
        this.combo = 0;
        this.missed++;
        this.speed = Math.max(16, this.speed * 0.82);
        app.profile.notes[a.n.key] = update(app.profile.notes[a.n.key] || newStat(), false);
        app.audio.sfx("miss");
        app.bubble(`Das war <b>${nameHtml(a.n)}</b>.`, 1.3);
        this.hudUpdate();
      }
    }
    draw(ctx, tx) {
      const line = this.line;
      drawBackground(ctx, this.bg, this.t * 6, this.t);
      drawStaff(ctx, line, 4, VIEW_W - 4, this.clef);
      ctx.fillStyle = C.RED;
      for (let y = yOfPos(11); y < yOfPos(-3); y += 4) ctx.fillRect(GATE - 9, y, 1, 2);
      this.notes.forEach((n, i) => {
        if (n.x > VIEW_W + 12) return;
        const y = yOfPos(n.pos);
        drawLedgers(ctx, q(n.x) - 9, 19, ledgerPositions(n.pos, this.clef), line);
        if (i === 0) {
          drawGlow(ctx, q(n.x), y, 0.6 + 0.3 * Math.sin(this.t * 6));
          drawNote(ctx, q(n.x), y, { halo: "#FFF1D6", style: n.missed ? "ghost" : "gold", up: stemUp(n.pos, this.clef), alt: n.n.alt, line: n.missed ? C.RED : C.K });
        } else drawNote(ctx, q(n.x), y, { style: "ink", up: stemUp(n.pos, this.clef), alt: n.n.alt, line });
      });
      drawClef(ctx, this.clef, 6, line);
      this.app.drawBuddy(ctx, this, 18, 38, this.t, this.freeze > 0 ? 0 : Math.abs(Math.sin(this.t * 4)) * 2);
      this.parts.draw(ctx);
      label(tx, "Tor", GATE - 9, yOfPos(12.6), { size: 18, color: "#FFFFFF", stroke: C.RED });
    }
  };

  // src/bau.js

  var BauScene = class {
    constructor(app, level) {
      this.app = app;
      this.level = level;
      this.isLevel = true;
    }
    enter() {
      const { app, level } = this;
      this.clef = level.clef;
      this.theme = level.theme;
      this.bg = app.background(level.theme);
      this.line = THEMES[level.theme].line;
      const ps = level.notes.map((k) => staffPos(N(k), this.clef));
      const g = this.clef === "grand";
      this.minPos = Math.max(g ? -8 : Math.min(-4, Math.min(...ps) - 1), Math.min(...ps) - 2);
      this.maxPos = Math.min(g ? 16 : 12, Math.max(...ps) + 2);
      this.tasks = this.buildTasks();
      this.ti = 0;
      this.firstTry = 0;
      this.t = 0;
      this.parts = new Particles();
      this.freed = [];
      app.panel.showMic(false);
      app.panel.bau(!!level.accidentals, { move: (d) => this.move(d), acc: (a) => this.setAcc(this.alt === a ? 0 : a), place: () => this.place() });
      app.hud.show(level.title, true);
      app.panel.task("Schiebe die Note mit <b>\u25B2 \u25BC</b> an die richtige Stelle und tippe <b>Setzen</b>.");
      this.startTask();
    }
    buildTasks() {
      const { level } = this, stats = this.app.profile.notes, out = [];
      let last = null;
      const words = (level.words || []).slice().sort(() => Math.random() - 0.5).slice(0, 3);
      const singles = 8 - words.length;
      for (let i = 0; i < singles; i++) {
        last = pickNext(level.notes, stats, Math.random, last);
        out.push({ notes: [N(last)], word: null });
      }
      words.forEach((w, i) => out.splice(2 + i * 2, 0, { word: w, notes: null }));
      return out;
    }
    startTask() {
      const tk = this.tasks[this.ti], { app } = this;
      this.slot = 0;
      this.placed = [];
      this.pos = Math.max(this.minPos, Math.min(this.maxPos, 4));
      this.alt = 0;
      this.tries = 0;
      this.t0 = performance.now();
      this.taskClean = true;
      this.wrongT = 0;
      this.msg = null;
      app.panel.setAcc(0);
      this.n = tk.word ? tk.word.length : 1;
      this.xs = Array.from({ length: this.n }, (_, i) => VIEW_W / 2 + 16 + (i - (this.n - 1) / 2) * 40);
      app.hud.progress(this.ti, this.tasks.length);
      app.bubble(tk.word ? `Schreibe das Wort <b>${tk.word}</b> \u2013 Note f\xFCr Note.` : `Setze die Note <b>${nameHtml(tk.notes[0])}</b> ins System.`, 0);
    }
    move(d) {
      this.pos = Math.max(this.minPos, Math.min(this.maxPos, this.pos + d));
      this.msg = null;
    }
    setAcc(a) {
      this.alt = a;
      this.app.panel.setAcc(a);
    }
    pointer(wx, wy) {
      if (wy < 18 || this.locked) return;
      this.pos = Math.max(this.minPos, Math.min(this.maxPos, Math.round((STAFF_BOTTOM - wy) / STEP_PX)));
      this.msg = null;
    }
    place() {
      if (this.locked) return;
      const { app } = this, p = app.profile, tk = this.tasks[this.ti];
      const cand = note(this.pos + CLEFS[this.clef].bottom, this.alt);
      app.audio.playNote(midiOf(cand));
      const ok = tk.word ? LETTERS[letterIdx(cand)] === tk.word[this.slot].toLowerCase() && !cand.alt : cand.step === tk.notes[0].step && cand.alt === tk.notes[0].alt;
      if (ok) {
        p.notes[cand.key] = update(p.notes[cand.key] || newStat(), this.tries === 0, performance.now() - this.t0 > SLOW_WRITE_MS);
        if (this.app.levelNoteKeys(this.level).includes(cand.key) && !p.creatures.includes(cand.key)) {
          p.creatures.push(cand.key);
          this.freed.push(cand);
        }
        this.placed.push(cand);
        this.parts.burst(this.xs[this.slot], yOfPos(this.pos), [C.YE, C.W, C.GL], 14);
        this.slot++;
        this.tries = 0;
        this.t0 = performance.now();
        if (this.slot < this.n) app.bubble(`Schreibe das Wort <b>${tk.word}</b> \u2013 Note f\xFCr Note.`, 0);
        if (this.slot >= this.n) {
          if (this.taskClean) this.firstTry++;
          this.locked = true;
          app.bubble("Richtig!", 1);
          setTimeout(() => {
            this.locked = false;
            this.ti++;
            if (this.ti >= this.tasks.length) {
              app.audio.sfx("done");
              app.finishLevel(this.level, { ratio: this.firstTry / this.tasks.length, freed: this.freed, line: `Beim ersten Versuch richtig: <b>${this.firstTry} von ${this.tasks.length}</b>` });
            } else this.startTask();
          }, 900);
        }
      } else {
        this.tries++;
        this.taskClean = false;
        this.wrongT = 0.5;
        const want = tk.word ? tk.word[this.slot].toLowerCase() : null;
        if (!tk.word) {
          const ck = `${tk.notes[0].key}>${cand.key}`;
          p.conf[ck] = (p.conf[ck] || 0) + 1;
          p.notes[tk.notes[0].key] = update(p.notes[tk.notes[0].key] || newStat(), false);
        }
        app.bubble(`Das ist <b>${nameHtml(cand)}</b> (${describePos(this.pos, this.clef)}). Gesucht ist <b>${tk.word ? want : nameHtml(tk.notes[0])}</b>.`, 0);
      }
    }
    update(dt) {
      this.t += dt;
      this.parts.update(dt);
      if (this.wrongT > 0) this.wrongT -= dt;
    }
    draw(ctx, tx) {
      const line = this.line, tk = this.tasks[Math.min(this.ti, this.tasks.length - 1)];
      drawBackground(ctx, this.bg, this.t * 3, this.t);
      drawStaff(ctx, line, 4, VIEW_W - 4, this.clef);
      drawClef(ctx, this.clef, 6, line);
      const dark = this.theme === "himmel" ? C.K : C.CREAM;
      for (let i = 0; i < this.n; i++) {
        const x = Math.round(this.xs[i]);
        if (i < this.placed.length) {
          const n = this.placed[i], pos = staffPos(n, this.clef);
          drawLedgers(ctx, x - 9, 19, ledgerPositions(pos, this.clef), line);
          drawNote(ctx, x, yOfPos(pos), { style: "ok", up: stemUp(pos, this.clef), alt: n.alt, line: C.K });
        } else if (i === this.slot && !this.locked) {
          const sx = x + (this.wrongT > 0 ? Math.round(Math.sin(this.wrongT * 50) * 2) : 0), y = yOfPos(this.pos);
          drawLedgers(ctx, x - 9, 19, ledgerPositions(this.pos, this.clef), line);
          drawGlow(ctx, sx, y, 0.55 + 0.25 * Math.sin(this.t * 5));
          drawNote(ctx, sx, y, { style: "gold", halo: "#FFF1D6", up: stemUp(this.pos, this.clef), alt: this.alt, line: C.K });
          if (this.tries >= 2 && !tk.word) {
            const tp = staffPos(tk.notes[0], this.clef);
            ctx.globalAlpha = 0.45;
            drawNote(ctx, x, yOfPos(tp), { style: "ghost", stem: false, line: C.G2 });
            ctx.globalAlpha = 1;
          }
        }
        if (tk.word) label(tx, tk.word[i], x, 126, { size: 30, color: i < this.placed.length ? "#B4EB6B" : "#FFFFFF", stroke: C.K });
      }
      this.app.drawBuddy(ctx, this, 18, 38, this.t, Math.abs(Math.sin(this.t * 4)) * 2);
      this.parts.draw(ctx);
    }
  };

        this.buddy = makeBuddy((n.step % 7 + 7) % 7, n.alt, st);
        this.buddySure = st === 2;
      }
    }
    resizeStage(W, H, top = 0, port = false) {
      this.W = W;
      this.H = H;
      this.top = top;
      const st = this.$("stage"), ph = H - 600 - top;
      st.style.width = W + "px";
      st.style.height = H + "px";
      st.style.setProperty("--wy", top + "px");
      st.style.setProperty("--H", H);
      st.style.setProperty("--ksy", Math.max(1, Math.min(2.8, (ph - 290) / 150)).toFixed(2));
      st.classList.toggle("port", port);
      st.classList.toggle("pbig", port && ph >= 700);
      st.classList.toggle("hud2", port && top > 100);
      for (const c of [this.world, this.$("text")]) {
        c.width = W;
        c.height = H;
        c.style.width = W + "px";
        c.style.height = H + "px";
      }
      this.ctx.setTransform(4, 0, 0, 4, 0, 0);
      this.ctx.imageSmoothingEnabled = false;
      setViewW(W / 4);
      this.$("panel").style.top = 600 + top + "px";
      this.$("panel").style.height = ph + "px";
      if (this.panel) this.panel.fitAnswers();
      st.classList.toggle("tall", !port && ph >= 300);
    }
    applyProfile() {
      const p = this.profile;
      setInstr(p ? p.instr : "klavier");
      this.audio.shift = INSTR.shift;
      this.refreshLook();
      this.audio.muted = !!this.state.muted;
      this.audio.setRef(this.state.micRef || (this.state.micGain ? GAIN_TARGET / this.state.micGain : 0));
      this.audio.setGain(this.state.micGain || 1);
      this.audio.song = this.state.song || "tanz";
      if (p) {
        this.audio.setA4(p.a4);
        this.audio.musicOff = p.music === false;
      }
      if (this.audio.muted || this.audio.musicOff) this.audio.stopMusic();
      if (this.paintSound) this.paintSound();
    }
    /** Ton für das ganze Gerät an oder aus (Musik, Spielklänge, Erfolgsmelodie). */
    setMuted(m) {
      this.state.muted = !!m;
      this.audio.muted = !!m;
      this.save();
      if (m) {
        this.audio.stopMusic();
        if (this.audio.bus) this.audio.bus.gain.value = 0;
      } else {
        this.audio.ensure();
        if (this.musicReady && this.scene instanceof Backdrop && !this.calib) this.audio.startMusic();
      }
      this.paintSound();
    }
    save() {
      const ok = persist(this.store, this.state);
      if (!this._quiet) touch(this);
      return ok;
    }
    flush() {
      const p = this.profile;
      if (p && this.sec >= 1) {
        const k = dayKey(), before = p.days[k] || 0, goal = (p.goal || 5) * 60;
        addPractice(p, this.sec);
        this.playTotal += this.sec;
        this.sec = 0;
        if (before < goal && p.days[k] >= goal) {
          this.toast(`Tagesziel geschafft: <b>${p.goal || 5} Minuten</b> ge\xFCbt!`);
          this.audio.sfx("star");
          track("tagesziel");
        }
        track("zeit/" + (this.scene && this.scene.level ? this.scene.level.type === "boss" ? "melodie" : this.scene.level.type : "menue"), Math.round(this.playTotal));
        this.playTotal = 0;
      }
      this.save();
    }
    background(theme) {
      return this.bgCache[theme] || (this.bgCache[theme] = makeBackground(theme));
    }
    backdrop(theme) {
      this.$("toast").hidden = true;
      if (this.musicReady) this.audio.startMusic();
      if (this.scene && this.scene.isLevel) this.flush();
      if (!(this.scene instanceof Backdrop) || this.scene.theme !== theme) this.scene = new Backdrop(this, theme);
      this.hud.hide();
      this.bubble(null);
      this.calib = null;
      this.audio.keepAwake(false);
    }
    levelNoteKeys(level) {
      return level.notes;
    }
    keyTap(midi) {
      const sc = this.scene;
      if (sc && sc.onNote && this.keysOn && !this.paused && this.$("screen").hidden) {
        this.audio.ensure();
        sc.onNote(midi);
      }
    }
    hudCr() {
      const p = this.profile;
      this.$("hudCr").innerHTML = `Notenwesen <b>${p ? p.creatures.length : 0}</b>`;
    }
    screen(html, handlers = {}, cls = "") {
      const sc = this.$("screen");
      sc.hidden = false;
      sc.className = cls;
      sc.innerHTML = `<div class="sheet">${html}</div>`;
      {
        const sheet = sc.firstElementChild, foot = sheet.querySelector(":scope > .mapnav, :scope > .stick");
        if (foot) {
          const body = document.createElement("div");
          body.className = "sbody";
          while (sheet.firstChild && sheet.firstChild !== foot) body.appendChild(sheet.firstChild);
          sheet.insertBefore(body, foot);
          sheet.classList.add("split");
        }
      }
      fill(sc);
      sc.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (b && !b.disabled && handlers[b.dataset.act]) handlers[b.dataset.act](b);
      };
      const f = sc.querySelector(".go,[data-act]");
      if (f && document.activeElement && document.activeElement.tagName !== "INPUT") f.focus({ preventScroll: true });
    }
    closeScreen() {
      const sc = this.$("screen");
      sc.hidden = true;
      sc.innerHTML = "";
    }
    bubble(html, secs = 0) {
      const b = this.$("bubble");
      clearTimeout(this._bt);
      if (!html) {
        b.hidden = true;
        return;
      }
      b.innerHTML = html;
      b.hidden = false;
      if (secs) this._bt = setTimeout(() => {
        b.hidden = true;
      }, secs * 1e3);
    }
    toast(html, note2) {
      const t = this.$("toast");
      t.innerHTML = `<span>${html}</span>`;
      if (note2) {
        const c = makeCreature((note2.step % 7 + 7) % 7, note2.alt);
        c.className = "pix";
        t.prepend(c);
      }
      t.hidden = false;
      clearTimeout(this._tt);
      this._tt = setTimeout(() => {
        t.hidden = true;
      }, 2400);
      this.hudCr();
    }
    /** Hinweis-Blase oben statt unten zeigen (wenn unten tiefe Noten stehen, z. B. auf den tiefen Gitarrensaiten). */
    bubbleSide(top) {
      this.$("bubble").classList.toggle("top", !!top);
    }
    runLevel(level) {
      this.closeScreen();
      this.paused = false;
      this.calib = null;
      this.bubble(null);
      this.hud.extra("");
      this.bubbleSide((level.notes || []).some((k) => staffPos(N(k), level.clef === "grand" ? "treble" : level.clef) <= -5));
      this.audio.keepAwake(true);
      this.audio.stopMusic();
      track("levelstart/" + level.id);
      const Cls = { jump: JumpScene, boss: JumpScene, regen: RegenScene, bau: BauScene, train: TrainScene }[level.type];
      this.scene = new Cls(this, level);
      this.scene.enter();
    }
    finishLevel(level, res) {
      const p = this.profile, stars2 = res.stars != null ? res.stars : starsFor(res.ratio), prev = p.levels[level.id], rec = prev || { stars: 0 };
      const out = { ...res, stars: stars2, firstClear: !prev };
      rec.stars = Math.max(rec.stars, stars2);
      if (res.time != null) {
        const nb = !rec.time || res.time < rec.time;
        if (nb) rec.time = Math.round(res.time * 10) / 10;
        if (p.mode === "profi") {
          out.newBest = nb;
          out.bestTime = rec.time;
        }
      }
      if (res.score != null) {
        out.newBest = !rec.score || res.score > rec.score;
        rec.score = Math.max(rec.score || 0, res.score);
        out.bestScore = rec.score;
        p.regenBest = Math.max(p.regenBest || 0, res.score);
      }
      p.levels[level.id] = rec;
      this.$("sndBtn").hidden = false;
      this.scene.isLevel = false;
      track("level/" + level.id);
      this.flush();
      this.bubble(null);
      this.$("hud").hidden = true;
      result(this, level, out);
    }
    /** Ende einer Trainingsrunde: rechnen, Rekord eintragen, Ergebnis zeigen. */
    finishTraining(level, raw) {
      const p = this.profile, rec = record(p, level.cfg, raw);
      this.$("sndBtn").hidden = false;
      this.scene.isLevel = false;
      track("training/" + (rec.disc || "wackelnoten"));
      this.flush();
      this.bubble(null);
      this.$("hud").hidden = true;
      trainResult(this, level, { ...raw, ...rec });
    }
    loop(ts) {
      const dt = Math.min(0.05, (ts - this.last) / 1e3);
      this.last = ts;
      const sc = this.scene;
      if (!this.paused || this.calib) {
        const ev = this.audio.poll(ts), sink = this.calib || (this.$("screen").hidden ? sc : null);
        if (ev && sink && sink.onNote && (this.calib || this.listening)) sink.onNote(ev.midi + INSTR.shift, ev);
        if (this.calib) this.calib.level(this.audio.level);
        else if (sc && sc.isLevel && sc.onNote) {
          const h = this.listening ? this.audio.heard : null;
          this.panel.setLevel(this.listening ? this.audio.level : 0);
          this.panel.setHeard(h ? h.midi + INSTR.shift : null);
        }
        if (ev) this.lastAct = ts;
        if (sc && !this.paused) {
          sc.update(dt);
          if (sc.isLevel && ts - (this.lastAct || 0) < IDLE_MS) {
            this.sec += dt;
            if (this.sec > 20) this.flush();
          }
        }
      }
      if (sc) {
        this.ctx.fillStyle = (THEMES[sc.theme] || THEMES.himmel).hill[4];
        this.ctx.fillRect(0, 0, VIEW_W, this.H / 4);
        this.tx.clearRect(0, 0, this.W, this.H);
        const ty = this.top / 4;
        if (ty) {
          this.ctx.fillStyle = (THEMES[sc.theme] || THEMES.himmel).bands[0];
          this.ctx.fillRect(0, 0, VIEW_W, ty);
          this.ctx.save();
          this.ctx.translate(0, ty);
          this.tx.save();
          this.tx.translate(0, this.top);
        }
        sc.draw(this.ctx, this.tx);
        if (ty) {
          this.ctx.restore();
          this.tx.restore();
        }
      }
      requestAnimationFrame((t) => this.loop(t));
    }
  };
  var start = () => {
    window.__nb = new App();
    window.__levels = LEVELS;
    window.__lv = levels_exports;
    window.__screens = screens_exports;
    window.__config = CONFIG;
    window.__train = trainui_exports;
    window.__acc = account_exports;
    window.__setInstr = setInstr;
    window.__flushStats = flushStats;
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start);
  else start();
})();
</script>
