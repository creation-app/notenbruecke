<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Die Notenbrücke</title>
<meta name="description" content="Die Notenbrücke: ein Lernspiel zum Notenlesen am Klavier. Lies die Note, spiel sie am echten Klavier, und die Brücke wächst.">
<meta name="theme-color" content="#26364B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2375CCF5'/%3E%3Cg fill='%2326364B'%3E%3Crect y='5' width='16' height='1'/%3E%3Crect y='10' width='16' height='1'/%3E%3Crect x='10' y='2' width='1' height='9'/%3E%3C/g%3E%3Crect x='5' y='9' width='6' height='4' fill='%23FFD966' stroke='%2326364B'/%3E%3C/svg%3E">
<style>
/*FONTS*/
:root{--k:#26364B;--cream:#FFF1D6;--b1:#2998E8;--b2:#174B83;--sky:#75CCF5;--g1:#78B833;--g2:#467C35;--or:#FF9D35;--ye:#FFD966;--red:#EF5350}
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#101826;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--k);font-size:22px;line-height:1.3}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;overflow:hidden;background:var(--k)}
canvas.pix,#world{image-rendering:pixelated;image-rendering:crisp-edges}
#world{position:absolute;left:0;top:0;width:1280px;height:800px}
#text{position:absolute;left:0;top:0;width:1280px;height:800px;pointer-events:none}
[hidden]{display:none!important}
#rotate{position:fixed;inset:0;z-index:9;background:var(--k);color:var(--cream);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:28px;font-weight:700}
h2{font-family:"Press Start 2P",monospace;font-size:24px;line-height:1.5;margin:0 0 14px}
h3{font-size:24px;margin:10px 0 6px}
p{margin:6px 0}
sup{font-size:.62em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--or);outline-offset:2px}
.btn{min-height:56px;padding:8px 22px;background:var(--cream);border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);font-weight:700;font-size:24px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.btn.go{background:var(--ye)}
.btn.big{font-size:32px;min-height:76px;padding:10px 44px;background:var(--ye)}
.btn.sm{min-height:48px;font-size:20px;padding:6px 14px}
.btn.danger{background:var(--red);color:#fff}
.btn.sel{background:var(--ye)}
.btn.quiet{min-height:44px;font-size:17px;font-weight:400;padding:4px 12px;background:#E8DCC4;border-width:2px;box-shadow:none;color:#3F4C63}
.btn.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1}
.btn.opt small,.toggle small{font-weight:400;font-size:18px}
.row{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.row.tight{gap:10px;margin-top:0}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch}
/* HUD */
#hud{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud .hl,#hud .hr{display:flex;gap:12px;align-items:center}
.box{background:var(--k);color:var(--cream);padding:13px 14px 11px;box-shadow:4px 4px 0 var(--b2);font-family:"Press Start 2P",monospace;font-size:13px;line-height:1.3}
#hudExtra,#hudCr{font-family:"Atkinson Hyperlegible",sans-serif;font-size:22px;padding:8px 14px}
.box b{color:var(--ye)}
#hudProg{display:flex;gap:5px;padding:14px 12px}
#hudProg i{width:12px;height:12px;background:#5A6C84}
#hudProg i.on{background:var(--ye)}
.pause{pointer-events:auto;width:56px;height:56px;border:none;background:var(--red);box-shadow:4px 4px 0 var(--k);display:flex;align-items:center;justify-content:center;gap:8px}
.pause i{width:8px;height:22px;background:var(--k)}
.snd{background:var(--cream)}.snd.off{background:#B9A98A}.snd.float{position:absolute;right:14px;bottom:14px;z-index:7}
#bubble{position:absolute;left:40px;top:530px;max-width:1000px;padding:10px 18px;background:var(--cream);border:4px solid var(--k);box-shadow:4px 4px 0 rgba(38,54,75,.35);font-size:25px;font-weight:700;pointer-events:none}
#toast{position:absolute;left:50%;top:14px;z-index:2;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--k);color:var(--cream);box-shadow:4px 4px 0 var(--or);font-size:26px;font-weight:700;pointer-events:none;white-space:nowrap}
#toast canvas{width:48px;height:48px}#toast b{color:var(--ye)}
/* Panel */
#panel{position:absolute;left:0;top:600px;width:1280px;height:200px;background:var(--b2);border-top:4px solid var(--k);box-shadow:inset 0 4px 0 var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.mic{display:flex;gap:22px;align-items:flex-start;width:600px}
.mic-ico{width:72px;height:72px;background:var(--k);display:flex;align-items:center;justify-content:center;flex:none}
.mic-l1{color:var(--cream);font-size:22px}
.mic-l2{color:var(--cream);font-size:27px;font-weight:700;min-height:70px;line-height:1.15}
.mic-l2.ok{color:#B4EB6B}.mic-l2.warn{color:var(--ye)}.mic-l2 b{font-size:1.15em}
.meter{display:flex;gap:4px;margin-top:6px}.meter i{width:24px;height:14px;background:var(--k)}.meter i.on{background:var(--g1)}.meter i.hi{background:var(--ye)}
.meter.big{justify-content:center}.meter.big i{width:36px;height:24px;background:#C9B79C}.meter.big i.on{background:var(--g1)}
.right{display:flex;justify-content:flex-end;flex:1}
#panel.solo .right{justify-content:center}
.kb{position:relative;width:544px;height:150px}
.kb button{position:absolute;top:0;border:4px solid var(--k);padding:0}
.wk{width:40px;height:150px;background:var(--cream);box-shadow:inset 0 -8px 0 #E3CFA8;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px!important;font-size:17px;font-weight:700}
.bk{width:26px;height:90px;background:var(--k);box-shadow:inset 0 -8px 0 #3D5270;z-index:1}
.kb .heard{background:var(--b1);box-shadow:inset 0 -8px 0 var(--b2)}
.kb .hint{background:var(--or);box-shadow:inset 0 -8px 0 #D97A1C;animation:blink .7s steps(2) infinite}
.kb .good{background:var(--g1)!important;box-shadow:inset 0 -8px 0 var(--g2)!important}
.kb .bad{background:var(--red)!important}
@keyframes blink{50%{filter:brightness(1.35)}}
.answers{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:1200px}
.btn.ans{min-width:120px;min-height:100px;font-size:50px;letter-spacing:1px}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bauctl{display:flex;gap:16px;align-items:center;justify-content:center;width:1200px}
.btn.sq{width:92px;min-height:92px;font-size:38px;padding:0}
.bauctl .go{min-height:92px;font-size:34px;padding:0 48px}
/* Menüs */
#screen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(23,40,66,.55);padding:20px}
#screen.clear{background:none}#screen.low{background:none;align-items:flex-end;padding-bottom:36px}
.sheet{background:var(--cream);border:4px solid var(--k);box-shadow:8px 8px 0 var(--k);padding:26px 32px;max-width:820px;width:100%;max-height:760px;overflow:auto}
#screen.wide .sheet{max-width:1220px;height:756px}
#screen.clear .sheet{background:none;border:none;box-shadow:none;text-align:center}
#screen.low .sheet{max-width:1100px}
.title .logo{font-family:"Press Start 2P",monospace;font-size:64px;line-height:1.25;color:var(--cream);text-shadow:6px 6px 0 var(--k),-3px 0 0 var(--k),3px 0 0 var(--k),0 -3px 0 var(--k)}
.title .sub{font-size:30px;font-weight:700;color:var(--k);background:var(--cream);display:inline-block;padding:4px 16px;margin:18px 0 30px;border:4px solid var(--k)}
.story{display:flex;gap:24px;align-items:center}.story p{font-size:28px;font-weight:400;margin:0}
.kicker{font-weight:700;color:var(--b2);text-transform:uppercase;letter-spacing:1px;font-size:18px}
.lead{font-size:26px;font-weight:700}
.note{background:#F3E3C3;padding:8px 12px;border-left:0;font-size:20px;min-height:0}.note:empty{display:none}.note.ok{background:#D6EFB3}.note.warn{background:#FFE2A8}
.err{color:#B3261E;font-weight:700;min-height:26px;margin:4px 0}
.muted{color:#5A6478;font-size:19px}
.fld{display:block;font-weight:700;margin:12px 0}.fld input{display:block;width:100%;font:inherit;padding:10px;border:4px solid var(--k);background:#fff;margin-top:6px;user-select:text;-webkit-user-select:text}
textarea{width:100%;font:16px/1.3 ui-monospace,monospace;border:4px solid var(--k);padding:8px;background:#fff;user-select:text;-webkit-user-select:text;margin:8px 0;word-break:break-all}
.heroes{display:flex;gap:10px;margin-top:6px}.hpick{background:#fff;border:4px solid var(--k);padding:6px 10px;min-width:84px;min-height:92px}.hpick.sel{background:var(--ye);box-shadow:4px 4px 0 var(--k)}
.plist{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:14px;width:200px;min-height:200px;font-size:22px}
.pcard small{font-size:17px}.pcard .plus{font-size:80px;line-height:96px;font-weight:700}.hide{display:none}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.maphead .row{flex-wrap:nowrap;gap:8px}.maphead .pill{font-size:18px;white-space:nowrap;padding:8px 12px}.maphead h2{margin:0}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--k);padding:4px 14px 4px 8px;min-height:56px;font-size:22px}
.pill{background:var(--k);color:var(--ye);padding:8px 12px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;min-height:52px;background:#E8D7B5;border:4px solid var(--k);font-weight:700;font-size:20px}.tab.sel{background:var(--k);color:var(--cream)}.tab:disabled{opacity:.6;font-size:16px;font-weight:400}
.mapq{margin:2px 0 8px;font-size:21px}
.mapnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:4px solid var(--k)}.mapnav .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:64px;padding:8px 14px;font-size:21px;background:#DDEBF7}.mapnav small{font-weight:400;font-size:16px}
.dots.small{justify-content:flex-start;gap:8px;margin-bottom:8px}.dots.small i{width:22px;height:22px;border-width:3px}.dots i.now{background:var(--ye)}
.nodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.node{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:8px 10px 8px 14px;min-height:104px;font-size:19px;line-height:1.15;border-left-width:14px}
.node small{font-size:16px;font-weight:400}.node b{padding-right:26px}.node .num{position:absolute;right:8px;top:6px;font-family:"Press Start 2P",monospace;font-size:12px;color:#5A6478}
.node.t-jump{border-left-color:var(--g1)}.node.t-regen{border-left-color:var(--b1)}.node.t-bau{border-left-color:var(--or)}.node.t-boss{border-left-color:var(--red);background:#FFE9E7}
.node:disabled{background:#C9CFD9;border-color:#6B7890;box-shadow:none;color:#3F4C63}.node .stars{margin-top:auto}.node .lock{margin-top:auto}
.stars{display:inline-flex;gap:4px}.stars i{width:22px;height:22px;background:#B9A98A;clip-path:polygon(50% 0,63% 36%,100% 38%,71% 61%,81% 100%,50% 78%,19% 100%,29% 61%,0 38%,37% 36%)}.stars i.on{background:var(--or)}
.stars.huge{gap:14px;margin:6px 0 10px}.stars.huge i{width:84px;height:84px}
.stars.pop i.on{animation:pop .5s backwards}.stars.pop i:nth-child(2){animation-delay:.25s}.stars.pop i:nth-child(3){animation-delay:.5s}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}}
.freed{background:#F3E3C3;padding:8px 12px;margin-top:8px}
.crcard{position:relative;display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:4px solid var(--k);padding:6px 8px;min-width:84px;min-height:96px;font-size:20px}
.crcard:disabled{background:#C9CFD9;border-color:#6B7890}.crcard.sel{background:var(--ye)}
.tick{position:absolute;right:4px;top:4px;width:14px;height:14px;background:var(--g1);border:2px solid var(--k)}
.collwrap{display:flex;gap:20px;align-items:flex-start}.coll{flex:1}.crgrid{display:flex;flex-wrap:wrap;gap:8px}
.crdetail{width:300px;flex:none;background:#fff;border:4px solid var(--k);padding:14px;text-align:center;position:sticky;top:0}
.staffpic{width:280px;height:320px;background:var(--cream);border:2px solid var(--k)}.crdetail .staffpic{width:210px;height:240px}
.bar{display:inline-block;vertical-align:middle;width:140px;height:16px;background:#C9B79C;border:2px solid var(--k)}.bar i{display:block;height:100%;background:var(--g1)}
.passgrid,.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:4px solid var(--k);padding:12px 16px}.card h3{margin-top:2px}
.bigno{font-family:"Press Start 2P",monospace;font-size:40px;margin:4px 0}.bigno small{font-family:"Atkinson Hyperlegible",sans-serif;font-size:22px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,26px);gap:5px;margin:8px 0 4px}.cal i{width:26px;height:26px;background:#E3D5B8}.cal .l1{background:#B9DE7A}.cal .l2{background:var(--g1)}.cal .l3{background:var(--g2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tag{background:var(--k);color:var(--cream);padding:3px 10px;font-weight:700}
.board{width:100%;border-collapse:collapse;font-size:22px;background:#fff}.board th,.board td{border:3px solid var(--k);padding:8px 12px;text-align:left}.board th{background:var(--k);color:var(--cream)}.board .me{background:#FFE9A8;font-weight:700}
.shortcode{font-family:"Press Start 2P",monospace;font-size:26px;letter-spacing:1px;background:#F3E3C3;padding:12px 8px;text-align:center;user-select:text;-webkit-user-select:text;margin:6px 0}
.place{display:flex;gap:24px;align-items:center;justify-content:center;margin:6px 0 12px}.place .staffpic{width:245px;height:280px}.place p{min-width:300px}
.answers.small{width:auto}.answers.small .ans{min-width:84px;min-height:72px;font-size:36px}
.qrrow{display:flex;gap:28px;align-items:flex-start;margin-top:8px}.qr{width:520px;height:520px;flex:none;border:4px solid var(--k)}
.pill.goal{position:relative;overflow:hidden;color:var(--cream)}.pill.goal i{position:absolute;left:0;bottom:0;height:5px;background:var(--or)}.pill.goal.ok{background:var(--g2)}
.book{max-height:640px;overflow:auto;padding-right:10px}.book p{max-width:1000px}.chapter{background:#F3E3C3;padding:6px 12px}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0}.offers .card{text-align:center}.offers .bigno{font-size:26px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}.btn:disabled{opacity:.55;cursor:default}
.lock.full{color:#8A4B00;font-weight:700}
.toggle{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;background:none;border:none;text-align:left;padding:6px 0}.toggle span{display:flex;flex-direction:column}
.toggle i{flex:none;width:60px;height:32px;background:#B9A98A;border:4px solid var(--k);position:relative}.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;background:var(--k)}
.toggle.on i{background:var(--g1)}.toggle.on i::after{left:30px}
.calib{text-align:center;background:#F3E3C3;padding:14px;margin-top:10px}.dots{display:flex;gap:14px;justify-content:center}.dots i{width:34px;height:34px;border:4px solid var(--k);background:#fff}.dots i.on{background:var(--g1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="rotate" hidden><p>Bitte dreh dein Gerät ins Querformat.</p></div>
<div id="stage">
  <canvas id="world" width="1280" height="800" aria-label="Spielwelt"></canvas>
  <canvas id="text" width="1280" height="800" aria-hidden="true"></canvas>
  <div id="hud" hidden><div class="hl"><div class="box" id="hudTitle"></div><div class="box" id="hudProg" role="img"></div></div>
    <div class="hr"><div class="box" id="hudExtra" hidden></div><div class="box" id="hudCr"></div><button class="pause snd" id="sndHud" aria-label="Ton ausschalten"></button><button class="pause" id="pauseBtn" aria-label="Pause"><i></i><i></i></button></div></div>
  <button class="pause snd float" id="sndBtn" aria-label="Ton ausschalten"></button>
  <div id="bubble" hidden role="status"></div>
  <div id="toast" hidden role="status"></div>
  <div id="panel" hidden></div>
  <div id="screen" hidden></div>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
