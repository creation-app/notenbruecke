<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Notenbrücke · Lehrer-Übersicht</title>
<style>
:root{--k:#26364B;--ye:#FFCB3D;--cr:#FFF1D6;--bl:#2998E8;--red:#C0392B}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#EEF3F8;color:var(--k)}#app{max-width:1150px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:12px 0 6px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:#fff;border:2px solid var(--k);border-radius:10px;padding:16px 18px;margin:14px 0}.narrow{max-width:420px;margin:60px auto}
label{display:flex;flex-direction:column;gap:4px;font-weight:600}input,select{font:inherit;padding:8px 10px;border:2px solid var(--k);border-radius:6px}button{font:inherit;font-weight:700;padding:8px 14px;border:2px solid var(--k);border-radius:6px;background:var(--ye);cursor:pointer}button.quiet{background:#fff}button.danger{background:#fff;color:var(--red);border-color:var(--red)}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.warn{color:var(--red)}.ok{color:#1E7B34}.muted{color:#5A6C84;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tiles div{background:#fff;border:2px solid var(--k);border-radius:10px;padding:12px 16px;font-size:14px}.tiles b{display:block;font-size:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card{margin:0}
.bars{display:flex;flex-direction:column;gap:6px}.bar{display:grid;grid-template-columns:minmax(120px,40%) 1fr auto;gap:10px;align-items:center;font-size:14px}.bt{background:#E4EBF2;height:14px;border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;background:var(--bl)}.bv{font-weight:700;white-space:nowrap}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:2px solid var(--k)}.days i{flex:1;background:var(--bl);border-radius:3px 3px 0 0;min-width:2px}.dlab{display:flex;justify-content:space-between;font-size:13px;color:#5A6C84}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #D7DFE8;vertical-align:top}th{background:#F4F7FA}tr.low td{background:#FDECEA}
.urow{cursor:pointer}.urow:hover td{background:#FFF8E1}.detail td{background:#FFFBEF}.det{display:grid;grid-template-columns:2fr 1fr;gap:20px}.wl{margin:4px 0;font-size:14px}.lv{display:inline-block;min-width:34px;text-align:center;margin:1px;padding:1px 3px;border-radius:4px;background:#E4EBF2;font-size:12px;color:#B8860B}.lv.s0{color:#9AA8B8}
#find{width:100%;max-width:300px}
@media (max-width:760px){table{font-size:13px}th,td{padding:6px 4px}.lvt th:first-child,.lvt td:first-child{display:none}.tiles{grid-template-columns:1fr 1fr}.two,.det{grid-template-columns:1fr}.users th:nth-child(n+4),.users td:nth-child(n+4){display:none}}
</style></head><body><main id="app"></main><script>window.NB_API=window.NB_API||/*API*/'';
/*BUNDLE*/</script></body></html>
